<!doctype html>
<!-- For development only: served by `npm run dev` at /voice-lab.html, left out of the build. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>Voice lab</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f6f4ef;
        --ink: #1f1d1a;
        --muted: #6b665d;
        --rule: #d9d4c9;
        --accent: #a3241c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1b1a18;
          --ink: #ece8df;
          --muted: #a29c90;
          --rule: #3a3833;
          --accent: #e0645a;
        }
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          1rem/1.5 Georgia,
          'Times New Roman',
          serif;
      }
      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }
      h1 {
        font-weight: normal;
        letter-spacing: 0.04em;
      }
      #status,
      #stopwatch,
      #trial-passage {
        color: var(--muted);
      }
      .reading {
        display: grid;
        grid-template-columns: 5rem 1fr;
        align-items: center;
        gap: 0.75rem;
        margin: 0.75rem 0;
      }
      audio {
        width: 100%;
      }
      #choices {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }
      button {
        font: inherit;
        padding: 0.5rem 1.25rem;
        border: 1px solid var(--accent);
        border-radius: 999px;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--accent);
        color: var(--paper);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #results {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      th,
      td {
        border-bottom: 1px solid var(--rule);
        padding: 0.35rem 0.6rem;
        text-align: left;
        vertical-align: top;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Voice lab</h1>
      <p id="status">Checking the voice…</p>
      <p id="stopwatch" hidden></p>
      <button id="begin" type="button" hidden>Begin</button>
      <section id="trial" hidden>
        <h2 id="trial-heading"></h2>
        <p id="trial-passage"></p>
        <div class="reading">
          <span>First</span>
          <audio id="first" controls preload="auto"></audio>
        </div>
        <div class="reading">
          <span>Second</span>
          <audio id="second" controls preload="auto"></audio>
        </div>
        <p>Which reading was better?</p>
        <div id="choices">
          <button type="button" value="first" disabled>First</button>
          <button type="button" value="second" disabled>Second</button>
          <button type="button" value="same" disabled>Same</button>
        </div>
      </section>
      <section id="results" hidden></section>
    </main>
    <script type="module" src="/src/voice/lab/main.ts"></script>
  </body>
</html>
